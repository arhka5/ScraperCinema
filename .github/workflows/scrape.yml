name: Actualizar cartelera

on:
  schedule:
    # 06:00, 10:00, 14:00 y 18:00 de Lima (UTC-5). Cuatro corridas al día
    # bastan: los horarios cambian poco y así se molesta poco a cada sitio.
    - cron: "0 11,15,19,23 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scraper/**", ".github/workflows/scrape.yml"]

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Instalar dependencias
        run: pip install -r scraper/requirements.txt

      - name: Pruebas de los parsers
        run: python -m pytest -q scraper/tests

      - name: Datos anteriores (respaldo si una cadena falla)
        run: |
          git fetch --depth=1 origin data:data 2>/dev/null \
            && git show data:cartelera.json > previous.json \
            || echo '{}' > previous.json

      - name: Ejecutar scraper
        run: python -m scraper --previous previous.json --output out/cartelera.json

      - name: Publicar en la rama "data"
        # Un solo commit que reemplaza al anterior: el historial no crece.
        run: |
          cd out
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cartelera.json
          git commit -q -m "Cartelera $(TZ=America/Lima date '+%Y-%m-%d %H:%M')"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
